<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Details</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <label class="hamburger-menu">
      <input type="checkbox" />
    </label>
    <header>
      <a class="header-anchor" href="index.html?">
        <p class="title">
          LEVERX <span class="header-logo-span">EMPLOYEE SERVICES</span>
        </p>
      </a>
      <div class="header-address-active">
        <a class="header-anchor" href="index.html?">
          <p>Adress Book</p>
        </a>
      </div>
      <div class="header-button-container">
        <button>
          <img
            src="images/question-circle-svgrepo-com.svg"
            alt="question icon"
          />SUPPORT
        </button>
        <button class="button-with-avatar">
          <img src="images/avataaars.png" />STEVE COOK
        </button>
        <button class="button-with-power-logo">
          <img src="./images/power-off-svgrepo-com.svg" alt="power logo" />
        </button>
      </div>
    </header>

    <div class="hidden-main-nav">
      <div class="hidden-main-nav-inner">
        <div>
          <div class="hidden-main-nav-inner-top">
            <img src="images/avataaars.png" alt="main image" />
            <div id="main-account">
              <p>Steve Cook</p>
              <p class="paragraph-smaller">Sign out</p>
            </div>
          </div>
          <div class="hidden-main-nav-inner-bottom">
            <h4>Adress Book</h4>
          </div>
        </div>

        <div class="hidden-main-nav-inner-bottom-button">
          <button class="hidden-main-button">
            <img
              src="images/question-circle-svgrepo-com.svg"
              alt="question"
            />SUPPORT
          </button>
        </div>
      </div>
    </div>

    <div class="user-details" id="user-details"></div>
    <script src="user.js"></script>
  </body>
</html>
