<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Leverx Employee Service</title>
  </head>
  <body>
    <label class="hamburger-menu">
      <input type="checkbox" />
    </label>
    <header>
      <a class="header-anchor" href="index.html">
        <p class="title">
          LEVERX <span class="header-logo-span">EMPLOYEE SERVICES</span>
        </p>
      </a>
      <div class="header-address-active">
        <a class="header-anchor" href="index.html">
          <p>Adress Book</p>
        </a>
      </div>
      <div class="header-button-container">
        <button>
          <img
            src="images/question-circle-svgrepo-com.svg"
            alt="question icon"
          />SUPPORT
        </button>

        <button
          onclick="window.location.href='user.html?id=10'"
          class="button-with-avatar"
        >
          <img src="images/avataaars.png" />STEVE COOK
        </button>

        <button class="button-with-power-logo">
          <img src="./images/power-off-svgrepo-com.svg" alt="power logo" />
        </button>
      </div>
    </header>
    <main>
      <aside>
        <div>
          <div class="tabs">
            <button id="basic-search" class="tab active">BASIC SEARCH</button>
            <button id="advanced-search" class="tab">ADVANCED SEARCH</button>
          </div>

          <div class="basic-content" id="basic-content">
            <div class="content-inside">
              <input
                type="text"
                class="search-input"
                placeholder="John Smith"
                id="basic-employee-search-input"
              />
              <button id="employee-search-btn" class="search-btn">
                SEARCH
              </button>
            </div>
          </div>

          <div class="advanced-content hidden" id="advanced-content">
            <form class="form" id="form">
              <label for="name">Name</label>
              <input
                name="name"
                id="name"
                type="text"
                placeholder="John Smith"
              />

              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="text"
                placeholder="john.smith@leverx.com"
              />
              <div class="phone-skype">
                <div>
                  <label for="phone">Phone</label>
                  <input
                    name="phone"
                    id="phone"
                    type="text"
                    placeholder="Phone number"
                  />
                </div>
                <div>
                  <label for="viber">Viber</label>
                  <input name="viber" type="text" placeholder="ViberId" />
                </div>
              </div>
              <div class="phone-skype">
                <div>
                  <label for="building">Building</label>
                  <select name="building" id="building">
                    <option>Select building</option>
                    <option>LeverX HQ – Poland</option>
                    <option>LeverX Dubai</option>
                    <option>LeverX HQ – Georgia</option>
                    <option>LeverX HQ – Kazakhstan</option>
                    <option>Remote</option>
                    <option>LeverX Bulgaria</option>
                    <option>LeverX HQ – Hungary</option>
                    <option>LeverX HQ – England</option>
                    <option>Leverx HQ</option>
                    <option>LeverX HQ — Ukraine</option>
                  </select>
                </div>
                <div>
                  <label for="room">Room</label>
                  <input
                    name="room"
                    id="room"
                    type="text"
                    placeholder="303.1"
                  />
                </div>
              </div>

              <label for="department">Department</label>
              <select name="department" id="department">
                <option>Select a department</option>
                <option>Web & Mobile</option>
                <option>Legal Department</option>
                <option>Human Resources (HR)</option>
                <option>Operations</option>
                <option>Research & Development (R&D)</option>
                <option>Customer Support</option>
                <option>IT / Information Technology</option>
                <option>Sales</option>
                <option>Marketing</option>
                <option>Finance & Accounting</option>
              </select>
              <button class="search-btn">SEARCH</button>
            </form>
          </div>
        </div>
      </aside>
      <section>
        <div class="button-section">
          <p>9 employees displayed</p>
          <div class="functional-buttons">
            <button id="button-grid">
              <svg
                class="clicked"
                id="svg-grid"
                fill="#b0a3ef"
                viewBox="0 0 32 32"
                version="1.1"
                xmlns="http://www.w3.org/2000/svg"
                stroke="#b0a3ef"
              >
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></g>
                <g id="SVGRepo_iconCarrier">
                  <path
                    d="M30 32h-10c-1.105 0-2-0.895-2-2v-10c0-1.105 0.895-2 2-2h10c1.105 0 2 0.895 2 2v10c0 1.105-0.895 2-2 2zM30 20h-10v10h10v-10zM30 14h-10c-1.105 0-2-0.896-2-2v-10c0-1.105 0.895-2 2-2h10c1.105 0 2 0.895 2 2v10c0 1.104-0.895 2-2 2zM30 2h-10v10h10v-10zM12 32h-10c-1.105 0-2-0.895-2-2v-10c0-1.105 0.895-2 2-2h10c1.104 0 2 0.895 2 2v10c0 1.105-0.896 2-2 2zM12 20h-10v10h10v-10zM12 14h-10c-1.105 0-2-0.896-2-2v-10c0-1.105 0.895-2 2-2h10c1.104 0 2 0.895 2 2v10c0 1.104-0.896 2-2 2zM12 2h-10v10h10v-10z"
                  ></path>
                </g>
              </svg>
            </button>
            <button id="button-list">
              <svg
                id="svg-list"
                viewBox="0 0 16 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></g>
                <g id="SVGRepo_iconCarrier">
                  <path d="M3 1H1V3H3V1Z" fill="#beb4f1"></path>
                  <path d="M3 5H1V7H3V5Z" fill="#beb4f1"></path>
                  <path d="M1 9H3V11H1V9Z" fill="#beb4f1"></path>
                  <path d="M3 13H1V15H3V13Z" fill="#beb4f1"></path>
                  <path d="M15 1H5V3H15V1Z" fill="#beb4f1"></path>
                  <path d="M15 5H5V7H15V5Z" fill="#beb4f1"></path>
                  <path d="M5 9H15V11H5V9Z" fill="#beb4f1"></path>
                  <path d="M15 13H5V15H15V13Z" fill="#beb4f1"></path>
                </g>
              </svg>
            </button>
          </div>
        </div>

        <div class="conditional-section hidden" id="conditional-section">
          <div>
            <img src="images/photo-svgrepo-com.svg" alt="photo icon" />
            <span>Photo</span>
          </div>
          <div>
            <img src="images/user-svgrepo-com.svg" alt="user icon" />
            <span>Name</span>
          </div>
          <div>
            <img src="images/briefcase-svgrepo-com.svg" alt="briefcase" />
            <span>Department</span>
          </div>
          <div>
            <img src="images/door-svgrepo-com.svg" alt="door" />
            <span>Room</span>
          </div>
        </div>

        <div class="employee-section" id="employee-section"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
