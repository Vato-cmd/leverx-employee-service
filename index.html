<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Leverx Employee Service</title>
  </head>
  <body>
    <label class="hamburger-menu">
      <input type="checkbox" />
    </label>
    <header>
      <a class="header-anchor" href="index.html">
        <p class="title">
          LEVERX <span class="header-logo-span">EMPLOYEE SERVICES</span>
        </p>
      </a>
      <div class="header-address-active">
        <a class="header-anchor" href="index.html">
          <p>Adress Book</p>
        </a>
      </div>
      <div class="header-button-container">
        <button>
          <img
            src="images/question-circle-svgrepo-com.svg"
            alt="question icon"
          />SUPPORT
        </button>

        <button
          onclick="window.location.href='user.html?id=10'"
          class="button-with-avatar"
        >
          <img src="images/avataaars.png" />STEVE COOK
        </button>

        <button class="button-with-power-logo">
          <img src="./images/power-off-svgrepo-com.svg" alt="power logo" />
        </button>
      </div>
    </header>
    <main>
      <aside>
        <div>
          <div class="tabs">
            <button id="basic-search" class="tab active">BASIC SEARCH</button>
            <button id="advanced-search" class="tab">ADVANCED SEARCH</button>
          </div>

          <div class="basic-content" id="basic-content">
            <div class="content-inside">
              <input
                type="text"
                class="search-input"
                placeholder="John Smith"
                id="basic-employee-search-input"
              />
              <button id="employee-search-btn" class="search-btn">
                SEARCH
              </button>
            </div>
          </div>

          <div class="advanced-content hidden" id="advanced-content">
            <form class="form" id="form">
              <label for="name">Name</label>
              <input
                name="name"
                id="name"
                type="text"
                placeholder="John Smith"
              />

              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="text"
                placeholder="john.smith@leverx.com"
              />
              <div class="phone-skype">
                <div>
                  <label for="phone">Phone</label>
                  <input
                    name="phone"
                    id="phone"
                    type="text"
                    placeholder="Phone number"
                  />
                </div>
                <div>
                  <label for="viber">Viber</label>
                  <input name="viber" type="text" placeholder="ViberId" />
                </div>
              </div>
              <div class="phone-skype">
                <div>
                  <label for="building">Building</label>
                  <select name="building" id="building">
                    <option>Select building</option>
                    <option>LeverX HQ – Poland</option>
                    <option>LeverX Dubai</option>
                    <option>LeverX HQ – Georgia</option>
                    <option>LeverX HQ – Kazakhstan</option>
                    <option>Remote</option>
                    <option>LeverX Bulgaria</option>
                    <option>LeverX HQ – Hungary</option>
                    <option>LeverX HQ – England</option>
                    <option>Leverx HQ</option>
                    <option>LeverX HQ — Ukraine</option>
                  </select>
                </div>
                <div>
                  <label for="room">Room</label>
                  <input
                    name="room"
                    id="room"
                    type="text"
                    placeholder="303.1"
                  />
                </div>
              </div>

              <label for="department">Department</label>
              <select name="department" id="department">
                <option>Select a department</option>
                <option>Web & Mobile</option>
                <option>Legal Department</option>
                <option>Human Resources (HR)</option>
                <option>Operations</option>
                <option>Research & Development (R&D)</option>
                <option>Customer Support</option>
                <option>IT / Information Technology</option>
                <option>Sales</option>
                <option>Marketing</option>
                <option>Finance & Accounting</option>
              </select>
              <button class="search-btn">SEARCH</button>
            </form>
          </div>
        </div>
      </aside>
    </main>
    <script src="script.js"></script>
  </body>
</html>
